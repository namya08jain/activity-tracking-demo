<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Activity</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="manager">
  <header class="topbar">
    <div class="topbar-inner wide">
      <div class="brand-group">
        <span class="brand">
          <img src="crizac-logo.svg" alt="Crizac" width="76" height="40">
          <span class="brand-product">Team activity</span>
        </span>
        <nav class="app-switch" aria-label="Manager views">
          <a href="/manager" class="on">Live</a>
          <a href="/reports">Reports</a>
        </nav>
      </div>
      <div class="topbar-right">
        <div id="clocks" class="clocks"></div>
        <span id="live" class="live off">Live</span>
      </div>
    </div>
  </header>

  <main class="page wide">
    <div class="mgr-top">
      <div>
        <h1>Who's working right now</h1>
        <p id="headcount" class="muted"></p>
      </div>
      <div class="mgr-tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search by name" autocomplete="off" aria-label="Search by name">
        </label>
        <select id="team-select" aria-label="Team"></select>
        <select id="office-select" aria-label="Office"></select>
      </div>
    </div>

    <div id="summary" class="summary status-filters" aria-label="Filter by status"></div>

    <div class="mgr-body">
      <aside class="team-list" aria-label="Teams">
        <h2>Teams</h2>
        <div id="teams"></div>
      </aside>

      <section class="people-panel" aria-label="People">
        <div class="people-head">
          <h2 id="people-title">Everyone</h2>
          <label class="sort">
            <span>Sort</span>
            <select id="sort" aria-label="Sort">
              <option value="attention">Needs a look first</option>
              <option value="name">Name</option>
              <option value="status">Status</option>
              <option value="activity">Lowest activity</option>
              <option value="work">Most work done</option>
              <option value="longest">Longest in status</option>
            </select>
          </label>
        </div>
        <div class="people-table">
          <div class="people-row people-columns" aria-hidden="true">
            <span>Name</span><span class="col-team">Team</span><span>Status</span><span class="col-app">In use</span>
            <span class="col-activity">Activity today</span><span class="col-work">Work</span><span class="col-flags">Flags</span>
          </div>
          <div id="scroller" class="scroller">
            <div id="spacer" class="spacer"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="demo-box">
      <b>Sample data</b>
      <div class="demo-actions"><button id="sample-people" class="secondary"></button></div>
    </div>
    <p id="server" class="server"></p>
  </main>

  <aside id="drawer" class="drawer" hidden aria-label="Person details">
    <div class="drawer-head">
      <div id="drawer-person" class="drawer-person"></div>
      <button id="drawer-close" class="ghost" aria-label="Close">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <script src="shared.js"></script>
  <script src="manager.js"></script>
</body>
</html>
